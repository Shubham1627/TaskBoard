# Serves the static frontend and reverse-proxies /api to the backend.
# Later in Kubernetes: nginx keeps serving files; routing /api moves to an Ingress (or proxy_pass to a Service).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/taskboard;
    index index.html;
    client_max_body_size 10m;

    location = /config.js { add_header Cache-Control "no-store"; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
